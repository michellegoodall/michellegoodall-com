<script>
  const blobShapes = [
    'M50,30 Q65,10 80,30 Q100,50 80,70 Q65,90 50,70 Q35,90 20,70 Q0,50 20,30 Q35,10 50,30Z',
    'M50,20 Q70,5 85,25 Q105,50 85,75 Q70,95 50,80 Q30,95 15,75 Q-5,50 15,25 Q30,5 50,20Z',
    'M50,25 Q65,15 75,30 Q90,50 75,70 Q65,85 50,75 Q35,85 25,70 Q10,50 25,30 Q35,15 50,25Z',
    'M50,28 Q68,12 80,30 Q100,50 80,70 Q68,88 50,72 Q32,88 20,70 Q0,50 20,30 Q32,12 50,28Z'
  ];

  let currentShape = 0;

  function createFloatingTrail(x, y, shape) {
    const trail = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    trail.setAttribute("width", "64");
    trail.setAttribute("height", "64");
    trail.setAttribute("viewBox", "0 0 100 100");
    trail.setAttribute("class", "trail-blob");

    const trailPath = document.createElementNS("http://www.w3.org/2000/svg", "path");
    trailPath.setAttribute("fill", "#811600");
    trailPath.setAttribute("d", shape);
    trailPath.setAttribute("filter", "url('assets/michellegoodall.com/file')");
    trail.appendChild(trailPath);
    document.body.appendChild(trail);

    let opacity = 0.5;
    let life = 0;
    const maxLife = 60;
    let tx = x + (Math.random() * 30 - 15);
    let ty = y + (Math.random() * 30 - 15);

    function float() {
      life++;
      const progress = life / maxLife;
      const easeOut = 1 - Math.pow(1 - progress, 3);
      const currX = x + (tx - x) * easeOut;
      const currY = y + (ty - y) * easeOut;

      trail.style.transform = `
        translate(${currX}px, ${currY}px)
        scale(1, 1)
        rotate(${Math.random() * 360}deg)
      `;
      trail.style.opacity = (1 - progress) * 0.5;

      if (life < maxLife) {
        requestAnimationFrame(float);
      } else {
        trail.remove();
      }
    }

    float();
  }

  function animateShapeChange() {
    currentShape = (currentShape + 1) % blobShapes.length;
    setTimeout(animateShapeChange, 3000);
  }

  document.addEventListener('mousemove', (e) => {
    const shape = blobShapes[currentShape];
    createFloatingTrail(e.clientX, e.clientY, shape);
  });

  animateShapeChange();
</script>
